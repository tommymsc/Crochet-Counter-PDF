name: Play release AAB
on:
  push:
    branches: [main]
    paths: ['.github/workflows/play-release.yml']
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Build and lint release
        run: gradle --no-daemon clean lintRelease bundleRelease -PliveAds=true
      - name: Sign and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          bundle=app/build/outputs/bundle/release/app-release.aab
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            cp "$bundle" output/crochet-UNSIGNED.aab
            echo "::warning::Upload signing secrets missing; bundle is NOT ready for Play."
          else
            keyfile="$(mktemp)"
            trap 'rm -f "$keyfile"' EXIT
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
            jarsigner -keystore "$keyfile" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD -signedjar output/crochet-play-signed.aab "$bundle" "$KEY_ALIAS"
            jarsigner -verify output/crochet-play-signed.aab
            keytool -printcert -jarfile output/crochet-play-signed.aab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: crochet-v1.3.1-code8-live-ads-bundle
          path: output/*.aab
          if-no-files-found: error
